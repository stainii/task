# The only internet-facing configuration in this system (#24, ADR-0010).
#
# There is no inbound port and no port-forwarding: `cloudflared` dials out and publishes exactly
# this container. So the exposure surface is not a firewall, it is this file — anything not routed
# below is unreachable from the internet, permanently and for free.
#
# TWO SETTINGS HERE ARE LOAD-BEARING AND NO TEST CAN CATCH THEM (ADR-0007). Testcontainers never
# puts nginx in the path, so the SSE stanza in the /api location is proven only by a stream held
# open against the deployed app. Both of its defaults fail *quietly*: proxy_read_timeout is 60s, so
# every stream would die after a minute, and proxy_buffering is on, so events would arrive in
# clumps instead of as they occur. ADR-0004's reconnect logic papers over both — the symptom is an
# app that works while reconnecting for ever.

# Keycloak runs with proxy-headers=xforwarded and sslRequired=external. TLS terminates at
# Cloudflare, so the origin only ever sees plain HTTP: without a truthful X-Forwarded-Proto,
# Keycloak refuses the login or emits http:// redirects. cloudflared sets the header; the map is
# what happens when something else does not (a LAN request straight at this container, say).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      https;
}

# HOW LONG EACH REQUEST LIVED, in the access log.
#
# ADR-0007 says the SSE stanza below is provable only against the deployed app, because nothing in
# the test suite puts nginx in the path. That is true, and it left the property observable only by
# inference: the first time it was checked in production, the stream's duration had to be worked out
# from the timestamps of the requests either side of it. $request_time makes the stream say how long
# it lived, so "SSE is being cut short" becomes something you can see in a log line instead of
# something you reason about — and a stream that starts dying at 60s stops being invisible.
log_format timed '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                 'took=${request_time}s "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log timed;

    # ADR-0010: `description` is TEXT and `changes` is JSONB, so an unbounded body lets a looping
    # client write until the disk fills — and ADR-0008's backup would faithfully preserve the
    # result. A patch is a handful of fields; 256k is roughly a thousand times more than one needs.
    client_max_body_size 256k;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------------------------------------
    # Default-deny, and what that means when a single-page app is involved
    # ---------------------------------------------------------------------------------------------
    # Only the three prefixes below are proxied anywhere. Everything else is served from this image
    # or falls through to index.html, which is the app's own client-side route space — /task/42 is
    # a route, not a file.
    #
    # That fallback is why /admin and /actuator are refused explicitly. They are not proxied, so
    # they are already unreachable; without these two blocks the SPA fallback would answer them
    # with 200 and a page, which reads like they exist. ADR-0010 asks for 404 and this is it.
    location /admin {
        return 404;
    }

    location /actuator {
        # ADR-0009's healthcheck reaches this over the Docker network, container to container. It
        # never traverses nginx, so refusing it here costs nothing.
        return 404;
    }

    # ---------------------------------------------------------------------------------------------
    # The API — one entry, not an enumeration
    # ---------------------------------------------------------------------------------------------
    # ADR-0010 rejected per-endpoint routing for a specific reason: local development goes through
    # proxy.conf.json and never touches nginx, so an endpoint missing from an allowlist here would
    # work perfectly on the laptop and 404 only in production. /api/config is unauthenticated and
    # everything else requires the `task-user` realm role — that boundary is Spring Security's, and
    # it is the right place for it, because it is the one that is tested.
    location /api/ {
        proxy_pass http://back-end:8080;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # THE SSE STANZA. ADR-0004 holds a stream open for 20 minutes with a 15-second heartbeat;
        # this timeout must sit outside that window, not inside it. Do not "tidy" these three lines.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;
    }

    # ---------------------------------------------------------------------------------------------
    # Keycloak — on this same origin, and /realms stays whole
    # ---------------------------------------------------------------------------------------------
    # Serving Keycloak here rather than on an auth. hostname keeps its session cookie first-party,
    # so silent SSO on reload keeps working as browsers remove third-party cookies (ADR-0010).
    #
    # DO NOT NARROW /realms/ TO /realms/*/protocol/. Keycloak's account console lives under
    # /realms/<realm>/account/, and it is the only way to sign a lost or stolen device out remotely
    # — which 30-day sessions make the standing remedy. Narrowing it looks like hardening, removes
    # that silently, and breaks nothing until the day it matters.
    # /resources/ and /js/ are the login page's own assets — without them it renders unstyled and
    # its JavaScript 404s. One regex location rather than three identical blocks, so the header set
    # below has a single copy and cannot drift between them.
    location ~ ^/(realms|resources|js)/ {
        proxy_pass http://keycloak:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ---------------------------------------------------------------------------------------------
    # The app itself
    # ---------------------------------------------------------------------------------------------
    # index.html and ngsw.json must not be cached, or a deploy ships to a browser that keeps asking
    # for the previous one. The hashed bundles they point at are immutable and cached hard.
    location = /index.html {
        add_header Cache-Control 'no-cache';
    }

    location = /ngsw.json {
        add_header Cache-Control 'no-cache';
    }

    location = /ngsw-worker.js {
        add_header Cache-Control 'no-cache';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
