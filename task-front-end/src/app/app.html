<header class="appbar">
  <!--
    The omnibox (ADR-0014). A control on the appbar and never a route, so typing does not change the
    URL and Escape returns you where you were. It carries capture, the one-list dropdown and the
    create toast; the template rows in that list arrive with #61.
  -->
  <app-omnibox />

  <button
    type="button"
    class="more"
    aria-label="More"
    matTooltip="More"
    [matMenuTriggerFor]="moreMenu"
  >
    ⋯
  </button>

  <mat-menu #moreMenu>
    <a mat-menu-item routerLink="/status">Status &amp; settings</a>
    <!-- Log out is the whole of FE-030 (ADR-0014). No profile, no account screen. -->
    <button mat-menu-item type="button" (click)="logOut()">Log out</button>
  </mat-menu>
</header>

<!--
  The stall prompt, raised *because a sync needs it* and never at boot (ADR-0004). It is a bar
  rather than a redirect: the app underneath keeps working, showing and accepting edits, and the
  queue drains in order behind the login. Offline it never appears — there is nothing to prompt for.
-->
@if (loginRequired()) {
  <div class="login-prompt" role="status">
    <span>Sign in to sync your changes. Nothing is lost in the meantime.</span>
    <button type="button" (click)="logIn()">Sign in</button>
  </div>
}

<!--
  Two destinations, no sidenav, no bottom bar and no rail: the phone and desktop shells differ only
  in density (ADR-0006's one continuum, holding at the navigation layer). FE-026's module menu is
  dropped.
-->
<nav class="tabs" aria-label="Destinations">
  <a routerLink="/" [class.active]="destination() === 'tasks'">Tasks</a>
  <a routerLink="/templates" [class.active]="destination() === 'templates'">Templates</a>
</nav>

<main>
  <router-outlet />
</main>

<!--
  A notice from a screen that has already gone (`ui/notices.ts`): ADR-0018's closed-task redirect
  unmounts the only component that knows why it happened, so the sentence has to outlive it. It
  lives in the shell rather than on a screen for exactly that reason.

  Not the overview's undo toast. That one carries a verb and a deadline; this one is a fact you have
  already lived through, and an `Undo` beside it would offer to reverse something that cannot be.
-->
@if (notice(); as notice) {
  <div class="notice" role="status">
    <span>{{ notice }}</span>
    <button type="button" (click)="dismissNotice()">Dismiss</button>
  </div>
}
