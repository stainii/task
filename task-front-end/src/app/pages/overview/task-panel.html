<!--
  The gesture is bound on the panel rather than on the row, so it stays available while the panel
  is open. `touch-action: pan-y` in the stylesheet is what lets a vertical scroll through this list
  still work: without it the browser hands us every gesture and the page stops scrolling.
-->
<div
  class="panel"
  [attr.data-bucket]="bucket()"
  [class.open]="open()"
  (pointerdown)="began($event)"
  (pointermove)="moved($event)"
  (pointerup)="ended()"
  (pointercancel)="ended()"
>
  <!--
    The fill says what the gesture is about to do. A gesture has no glyph, so this is one of the
    places ADR-0019 leaves words in place — an unlabelled two-way swipe on a destructive-ish action
    is a coin flip.
  -->
  <div class="fill right" [style.width.px]="rightFill()" aria-hidden="true">
    <span>Complete</span>
  </div>
  <div class="fill left" [style.width.px]="leftFill()" aria-hidden="true"><span>Cancel</span></div>

  <button type="button" class="row" [attr.aria-expanded]="open()" (click)="toggle()">
    <span class="name">{{ task().name }}</span>
    <span class="meta">
      <!-- The axis the list is grouped by, shown on the row (ADR-0006). Context today, and the
           bands below know nothing about which axis that is. -->
      @if (showContext()) {
        <span class="context">{{ task().context }}</span>
      }
      <span class="due" [class]="'tone-' + tone()">{{ due() }}</span>
      <!-- A fact, so a word (ADR-0019) — and the one thing the collapsed row could never say. -->
      @if (hasDescription()) {
        <span class="notes">notes</span>
      }
      <span class="caret" aria-hidden="true">{{ open() ? '▴' : '▾' }}</span>
    </span>
  </button>

  @if (open()) {
    <div class="body">
      <!--
        *When this chore was last actually done* (#88) — for template-generated tasks only. A fact,
        so words (ADR-0019); the `↻` is decoration the label already says in full. The value is the
        server's whole history floored by local completions, computed by the overview and passed in,
        so it is fresh after a completion here and correct for a chore last done months ago that
        `GET /api/tasks` no longer carries.
      -->
      @if (fromTemplate()) {
        <p class="facts"><span aria-hidden="true">↻</span> {{ lastDone() }}</p>
      }

      <!--
        **URLs linkified, and nothing else** (ADR-0015). Built from runs rather than from a string of
        HTML, which is the security half of the same decision: nothing here writes markup, so nothing
        pasted into a description can inject any. `noopener` because this app holds a live session.
      -->
      <p class="description">
        @for (run of description(); track $index) {
          @if (run.href; as href) {
            <a [href]="href" target="_blank" rel="noopener noreferrer">{{ run.text }}</a>
          } @else {
            {{ run.text }}
          }
        }
      </p>

      <div class="verbs">
        <span class="constructive">
          <app-glyph-button verb="edit" (click)="edit()" />
          <app-glyph-button verb="postpone" [matMenuTriggerFor]="postponeMenu" />
          <!--
            The split Complete (issue #83, variant B). The left half is the fast path — one tap,
            today, silent, the same thing a swipe-right does. The ▾ is the deliberate "…that was
            Saturday" surface, a disclosure caret like the row's own, next to where Postpone's menu
            already lives (ADR-0018).
          -->
          <span class="complete-split">
            <app-glyph-button verb="complete" tone="good" (click)="complete()" />
            <button
              type="button"
              class="done-when"
              aria-label="Complete on another day"
              matTooltip="Complete on another day"
              [matMenuTriggerFor]="doneWhenMenu"
            >
              ▾
            </button>
          </span>
        </span>
        <!-- Pushed to the far edge: colour already says *category*, but never *which*. -->
        <span class="destructive">
          <app-glyph-button verb="cancel" tone="danger" (click)="cancel()" />
        </span>
      </div>

      <mat-menu #postponeMenu>
        @for (preset of presets; track preset.days) {
          <button mat-menu-item type="button" class="postpone-preset" (click)="postpone(preset)">
            {{ preset.label }}
          </button>
        }
      </mat-menu>

      <mat-menu #doneWhenMenu>
        @for (preset of doneWhenPresets; track preset.days) {
          <button mat-menu-item type="button" class="done-when-preset" (click)="completeOn(preset)">
            {{ preset.label }}
          </button>
        }
        <!-- Older than two days is a real date, and it goes through the shell's one confirm. -->
        <button mat-menu-item type="button" class="done-when-past" (click)="completeInThePast()">
          In the past…
        </button>
      </mat-menu>
    </div>
  }
</div>
