<!--
  Nothing at all on a device holding no open work: a row of zero cards is a heading over an absence,
  and the bands below already say `Relax! Nothing else to do.`
-->
@if (cards().length > 0) {
  <nav class="cards" aria-label="Contexts">
    @for (card of cards(); track card.value) {
      <a
        class="card"
        [class.entered]="card.value === entered()"
        [routerLink]="['/in', card.value]"
        [attr.aria-current]="card.value === entered() ? 'true' : null"
      >
        <!--
          The dominant-bucket dot: the importance bucket of the soonest task in the context, and all
          that is left of the six-segment bar (#82). Like the bar it describes the context rather
          than started work, so it is `aria-hidden` — the facts it backs up are the words beside it.
        -->
        <span class="dot" [class]="'bucket-' + card.dominant" aria-hidden="true"></span>

        <span class="context">{{ card.value }}</span>

        <!-- A true total, sleeping work included: a count that is not a total is not a count. -->
        <span class="count">{{ card.count }}</span>

        <!--
          **Started tasks only** (ADR-0015), and **in words** (ADR-0019). A card claiming `1 overdue`
          over a context you can click into and find nothing overdue in does not survive being
          checked; and `⚠2` would be a glyph standing in for a fact, which the map does not do.
        -->
        @if (card.badge; as badge) {
          <span class="badge" [class]="'badge-' + badge.kind">{{ this.badge(badge) }}</span>
        }
      </a>
    }
  </nav>
}
