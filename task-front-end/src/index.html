<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tasks</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Dark mode follows the system, with no toggle (ADR-0015). -->
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      Installable (RES-013, #62). Offline use is the point, and an installed origin is also what
      exempts the store from Safari's seven-day eviction — so the manifest is load-bearing for
      #55's `navigator.storage.persist()`, not decoration. iOS ignores the manifest's icons and
      reads `apple-touch-icon`, which is why the same artwork is declared twice.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#3f51b5" />
    <!--
      No web fonts and no icon font, deliberately. ADR-0019 spends four inline SVG glyphs on the
      four verbs, so there is nothing to fetch; the type is the system stack. Both used to be
      loaded from fonts.googleapis.com, which an installed PWA (RES-013) cannot rely on and which
      ADR-0010's one-origin rule would have to route around.
    -->
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
