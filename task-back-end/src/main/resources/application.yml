recurring-tasks:
  create-due-tasks:
    cron: "0 0 4 * * *"

# TODO-042/043: the zone this application thinks in, whatever the host is set to. It feeds the
# Clock bean (config/TimeConfig), which is the only way src/main can read the current date -
# JavaTimeDefaultTimeZone is an ERROR, so LocalDate.now() does not compile. ADR-0012's 07:30
# push and the due check's notion of "today" both hang off this one line.
task:
  time-zone: Europe/Brussels

  sse:
    # ADR-0004: the server closes a stream after this long and the client reconnects. Bounded partly
    # so an expired token cannot keep streaming, but mostly so that reconnect-and-resume - the most
    # load-bearing and least observable mechanism in the sync contract - runs several times an hour
    # on every device rather than only when the wifi happens to fail. A knob only because the tests
    # have to shrink it; the contract's range is 15-30 minutes.
    connection-lifetime: 20m

    # ADR-0004: keeps a proxy from idling the connection out. ADR-0007 hands nginx the matching
    # obligation - proxy_read_timeout must sit outside this window, or the stream dies silently.
    heartbeat-interval: 15s

# ADR-0009: health is the only management endpoint, and it exists for compose's healthcheck,
# not for a monitoring stack. Details stay hidden — up or down is all anything needs.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# ADR-0009: logs outlive container recreation, or a nightly deploy erases the week.
logging:
  file:
    name: ${LOG_DIR:logs}/task-back-end.log
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_DIR:logs}/task-back-end.%d{yyyy-MM-dd}.%i.log.gz
      max-history: 30
      total-size-cap: 1GB

spring:
  application.name: task-back-end
  # No datasource block on purpose. In development spring-boot-docker-compose derives the
  # connection from compose.yaml, and in production it arrives as environment variables; the
  # four lines that used to sit here named localhost:5432 while compose publishes 61655, and
  # nothing ever read them (#18 reported that as a defect, #11 established it is not one).
  # Deleted rather than corrected, on #30's argument: config whose values are wrong but which
  # looks settled is worse than no config, because nobody re-reads it.
  security:
    oauth2:
      resourceserver:
        jwt:
          # ADR-0010: the realm is shared infrastructure named after its owner, not after this app;
          # `task` is one client in it. Dev value only — production arrives as KEYCLOAK_ISSUER_URI.
          issuer-uri: http://localhost:8081/realms/stijnhooft-realm
  mvc.async.request-timeout: 0
  jackson.deserialization.fail-on-null-for-primitives: false


## avoid sse events connection to be cut off
server.tomcat.connection-timeout: 0
