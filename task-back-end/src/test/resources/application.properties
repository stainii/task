# The due check is off for the whole suite, and this file exists only to say so.
#
# ADR-0016's `initialDelay = 0` means the tick fires as soon as any Spring context refreshes - so
# without this it would fire in *every* integration test context, against the Postgres container
# every test class shares, creating tasks nobody asked for while another class is asserting on its
# own (#10's isolation problem, `docs/quality-bar.md` section 5).
#
# `DueCheckStartupIntegrationTest` turns it back on for one context and proves the startup fire
# really happens. Production never sets this property; `matchIfMissing = true` is the real default.
#
# A .properties file rather than an application.yml: a test-classpath application.yml would shadow
# src/main/resources/application.yml entirely, and the suite would silently lose every setting in it.
task.due-check.enabled=false

# The 07:30 push is off for the whole suite, for the same reason the due check is: a run that
# happened to straddle 07:30 would sweep the shared Postgres and post to the internet. ADR-0012's
# job is driven directly by DailyPushServiceIntegrationTest, and DailyPushScheduleTest asserts the
# schedule itself against the registered task rather than by waiting for the morning.
task.daily-push.enabled=false
